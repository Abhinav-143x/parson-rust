<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parson-Rust Live Demo | Safe JSON Parsing</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-mesh"></div>
    
    <div class="container">
        <header>
            <h1>Parson-Rust Engine</h1>
            <p class="subtitle">Simplicity & Safety. 3x Faster. Zero Trade-offs.</p>
            <div class="badges">
                <span class="badge safe">#![forbid(unsafe_code)]</span>
                <span class="badge wasm">WebAssembly Native</span>
            </div>
        </header>

        <div class="editor-grid">
            <!-- Left: Editor -->
            <div class="panel">
                <div class="panel-header">
                    <span>Input (Raw JSON)</span>
                    <button id="format-btn" class="btn primary">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 5px;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Execute
                    </button>
                </div>
                <textarea id="json-input" spellcheck="false" placeholder="Enter JSON here...">
{
  "project": "parson-rust",
  "status": "victory",
  "speedup": 2.999,
  "safe": true,
  "unsafe_blocks": 0
}
                </textarea>
            </div>

            <!-- Right: Terminal Simulator -->
            <div class="panel terminal-panel">
                <div class="terminal-header">
                    <div class="mac-buttons">
                        <div class="mac-btn close"></div>
                        <div class="mac-btn minimize"></div>
                        <div class="mac-btn maximize"></div>
                    </div>
                    <span>rust@wasm-sandbox:~</span>
                </div>
                <div id="terminal-body" class="terminal-body">
                    <!-- Terminal output goes here -->
                </div>
            </div>
        </div>
        
        <footer>
            Built for the Code Resurrection 2026 Hackathon
        </footer>
    </div>

    <script type="module">
        import init, { parse_and_format } from './pkg/parson_port.js';

        const terminalBody = document.getElementById('terminal-body');
        
        function appendTerminal(text, type = "normal") {
            const div = document.createElement("div");
            div.className = `term-line ${type}`;
            div.textContent = text;
            terminalBody.appendChild(div);
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }

        async function typeWriter(text, type, speed = 10) {
            const div = document.createElement("div");
            div.className = `term-line ${type}`;
            terminalBody.appendChild(div);
            
            for(let i = 0; i < text.length; i++) {
                div.textContent += text.charAt(i);
                terminalBody.scrollTop = terminalBody.scrollHeight;
                await new Promise(r => setTimeout(r, speed));
            }
        }

        async function run() {
            // Initialize the REAL WebAssembly module compiled from our Rust code
            appendTerminal("[SYSTEM] Loading WebAssembly binary (parson_port.wasm)...", "dim");
            const wasmInit = init();
            await wasmInit;
            appendTerminal("[SYSTEM] Safe Rust Engine Initialized. 100% memory safe.", "success");
            appendTerminal("", "normal");

            const inputArea = document.getElementById('json-input');
            const btn = document.getElementById('format-btn');

            const handleParse = async () => {
                const input = inputArea.value;
                
                terminalBody.innerHTML = "";
                appendTerminal("> Calling WebAssembly parse_and_format() function...", "cmd");
                
                try {
                    // This calls the REAL Rust function in src/wasm.rs!
                    const t0 = performance.now();
                    const result = parse_and_format(input);
                    const t1 = performance.now();
                    
                    if (result.startsWith("Error")) {
                        appendTerminal(`AST PARSE FAILED (took ${(t1-t0).toFixed(2)}ms):`, "error");
                        appendTerminal(result, "error");
                    } else {
                        appendTerminal(`AST PARSE SUCCESS (took ${(t1-t0).toFixed(2)}ms):`, "success");
                        appendTerminal(result, "json-out");
                    }
                } catch (e) {
                    appendTerminal("Fatal Wasm Error: " + e, "error");
                }
                appendTerminal("", "normal");
            };

            // Parse on button click
            btn.addEventListener('click', () => {
                btn.classList.add('pulse');
                setTimeout(() => btn.classList.remove('pulse'), 200);
                handleParse();
            });

            // Initial parse
            handleParse();
        }

        run();
    </script>
</body>
</html>
