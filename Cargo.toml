[package]
name = "parson_port"
version = "0.1.0"
edition = "2021"
description = "Idiomatic Rust port of kgabis/parson — a lightweight JSON parser"
license = "MIT"

[lib]
name = "parson_port"
path = "src/lib.rs"

[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"

[dependencies]
rand = "0.8.5"
serde_json = "1.0"

[dev-dependencies]

[profile.release]
opt-level = 3

# Keep this crate independent from the root workspace
[workspace]
